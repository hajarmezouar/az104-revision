name: Publish AZ-104 Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Verify entry point
        run: test -f app/index.html
      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: app
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
